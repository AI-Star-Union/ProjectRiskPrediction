name: Testing model accuracy

on:
  pull_request:
    branches:
      - main

jobs:
  test-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run model evaluation
        run: python test/test-model.py
        continue-on-error: true

      - name: Comment results on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let body;
            try {
              const raw = fs.readFileSync('metrics.json', 'utf8');
              const metrics = JSON.parse(raw);

              body = [
                '## Model evaluation results',
                '',
                `**Accuracy**: ${metrics.accuracy}`,
                `**F1 score (weighted)**: ${metrics.f1_score}`,
                '',
                '### Classification report',
                '',
                '```',
                metrics.classification_report,
                '```'
              ].join('\n');
            } catch (error) {
              body = [
                '## Model evaluation results',
                '',
                'Model evaluation failed or `metrics.json` could not be read.',
                '',
                'Please check the CI logs for details (missing test data or model artifacts are common causes).'
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
